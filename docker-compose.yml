services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bike_competition}
      POSTGRES_USER: ${POSTGRES_USER:-bike_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bike_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-bike_competition}
      FLASK_ENV: ${FLASK_ENV:-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
